<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রতিদিনের ক্লাস রুটিন ম্যানেজমেন্ট</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h2, h3 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Form Styling */
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
        }
        .input-box label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-box input, .input-box select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            grid-column: 1 / -1;
            justify-self: start;
        }
        .btn-submit:hover {
            background-color: #27ae60;
        }

        /* Day Tabs Styling */
        .day-tabs {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 20px;
            background-color: #bdc3c7;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: #3498db;
            color: white;
        }
        .tab-btn:hover {
            background-color: #2980b9;
            color: white;
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        td:first-child {
            font-weight: bold;
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        .subject-text {
            font-weight: bold;
            color: #2c3e50;
            display: block;
        }
        .teacher-text {
            font-size: 11px;
            color: #7f8c8d;
            font-style: italic;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ১. ক্লাস রুটিন এন্ট্রি ফরম -->
    <h2>ক্লাস রুটিন এন্ট্রি ফরম</h2>
    <form id="routineForm">
        <div class="form-group">
            <div class="input-box">
                <label>বছর/সাল</label>
                <input type="number" id="year" value="2026" required>
            </div>
            <div class="input-box">
                <label>শ্রেণি</label>
                <select id="className" required>
                    <option value="">শ্রেণি নির্বাচন করুন</option>
                    <option value="ষষ্ঠ শ্রেণি">ষষ্ঠ শ্রেণি</option>
                    <option value="সপ্তম শ্রেণি">সপ্তম শ্রেণি</option>
                    <option value="অষ্টম শ্রেণি">অষ্টম শ্রেণি</option>
                    <option value="নবম শ্রেণি">নবম শ্রেণি</option>
                    <option value="দশম শ্রেণি">দশম শ্রেণি</option>
                </select>
            </div>
            <div class="input-box">
                <label>বার (Day)</label>
                <select id="day" required>
                    <option value="শনিবার">শনিবার</option>
                    <option value="রবিবার">রবিবার</option>
                    <option value="সোমবার">সোমবার</option>
                    <option value="মঙ্গলবার">মঙ্গলবার</option>
                    <option value="বুধবার">বুধবার</option>
                    <option value="বৃহস্পতিবার">বৃহস্পতিবার</option>
                </select>
            </div>
            <div class="input-box">
                <label>পিরিয়ড/ঘণ্টা</label>
                <select id="period" required>
                    <option value="1">১ম ঘণ্টা</option>
                    <option value="2">২য় ঘণ্টা</option>
                    <option value="3">৩য় ঘণ্টা</option>
                    <option value="4">৪র্থ ঘণ্টা</option>
                    <option value="5">৫ম ঘণ্টা</option>
                    <option value="6">৬ষ্ঠ ঘণ্টা</option>
                    <option value="7">৭ম ঘণ্টা</option>
                    <option value="8">৮ম ঘণ্টা</option>
                </select>
            </div>
            <div class="input-box">
                <label>বিষয়</label>
                <input type="text" id="subject" placeholder="যেমন: গণিত" required>
            </div>
            <div class="input-box">
                <label>শিক্ষকের নাম (সংক্ষেপে)</label>
                <input type="text" id="teacher" placeholder="যেমন: M.R." required>
            </div>
        </div>
        <button type="submit" class="btn-submit">রুটিনে এন্ট্রি করুন</button>
    </form>

    <!-- ২. বারের আলাদা ট্যাব সিলেক্টর -->
    <div class="day-tabs" id="dayTabs">
        <button class="tab-btn active" onclick="switchDay('শনিবার')">শনিবার</button>
        <button class="tab-btn" onclick="switchDay('রবিবার')">রবিবার</button>
        <button class="tab-btn" onclick="switchDay('সোমবার')">সোমবার</button>
        <button class="tab-btn" onclick="switchDay('মঙ্গলবার')">মঙ্গলবার</button>
        <button class="tab-btn" onclick="switchDay('বুধবার')">বুধবার</button>
        <button class="tab-btn" onclick="switchDay('বৃহস্পতিবার')">বৃহস্পতিবার</button>
    </div>

    <!-- ৩. দৈনিক রুটিন টেবিল (শ্রেণি ভিত্তিক সারি ও ১ম থেকে ৮ম ঘণ্টা কলাম) -->
    <h3 id="tableTitle">শনিবারের ক্লাস রুটিন</h3>
    <div class="table-responsive">
        <table id="routineTable">
            <thead>
                <tr>
                    <th>শ্রেণি</th>
                    <th>১ম ঘণ্টা</th>
                    <th>২য় ঘণ্টা</th>
                    <th>৩য় ঘণ্টা</th>
                    <th>৪র্থ ঘণ্টা</th>
                    <th>৫ম ঘণ্টা</th>
                    <th>৬ষ্ঠ ঘণ্টা</th>
                    <th>৭ম ঘণ্টা</th>
                    <th>৮ম ঘণ্টা</th>
                </tr>
            </thead>
            <tbody id="routineBody">
                <!-- জাভাস্ক্রিপ্টের মাধ্যমে ডাইনামিকালি তথ্য লোড হবে -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let routineData = [];
    let currentSelectedDay = "শনিবার";
    
    const classesList = ["ষষ্ঠ শ্রেণি", "সপ্তম শ্রেণি", "অষ্টম শ্রেণি", "নবম শ্রেণি", "দশম শ্রেণি"];

    // ফরম সাবমিট হ্যান্ডলার
    document.getElementById('routineForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const entry = {
            year: document.getElementById('year').value,
            className: document.getElementById('className').value,
            day: document.getElementById('day').value,
            period: parseInt(document.getElementById('period').value),
            subject: document.getElementById('subject').value,
            teacher: document.getElementById('teacher').value
        };

        // একই শ্রেণি, বার এবং পিরিয়ডে ডাটা থাকলে আপডেট হবে, নয়তো নতুন যোগ হবে
        const existingIndex = routineData.findIndex(item => 
            item.year === entry.year && 
            item.className === entry.className && 
            item.day === entry.day && 
            item.period === entry.period
        );

        if (existingIndex > -1) {
            routineData[existingIndex] = entry;
        } else {
            routineData.push(entry);
        }

        // ইনপুট রিসেট
        document.getElementById('subject').value = '';
        document.getElementById('teacher').value = '';

        // টেবিল রিফ্রেশ
        renderRoutineTable();
    });

    // ট্যাব পরিবর্তন ফাংশন
    function switchDay(day) {
        currentSelectedDay = day;
        
        // বাটনের অ্যাক্টিভ ক্লাস পরিবর্তন
        let buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => {
            if(btn.innerText === day) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        document.getElementById('tableTitle').innerText = `${day}র ক্লাস রুটিন`;
        renderRoutineTable();
    }

    // টেবিল রেন্ডার করার ফাংশন
    function renderRoutineTable() {
        const tbody = document.getElementById('routineBody');
        tbody.innerHTML = '';

        classesList.forEach(cls => {
            let rowHtml = `<tr><td>${cls}</td>`;

            for (let p = 1; p <= 8; p++) {
                // বর্তমান নির্বাচিত বার এবং শ্রেণির জন্য পিরিয়ড ম্যাচ করা
                const matchedEntry = routineData.find(item => 
                    item.day === currentSelectedDay && 
                    item.className === cls && 
                    item.period === p
                );

                if (matchedEntry) {
                    rowHtml += `<td>
                        <span class="subject-text">${matchedEntry.subject}</span>
                        <span class="teacher-text">(${matchedEntry.teacher})</span>
                    </td>`;
                } else {
                    rowHtml += `<td>-</td>`;
                }
            }

            rowHtml += `</tr>`;
            tbody.innerHTML += rowHtml;
        });
    }

    // প্রাথমিক রেন্ডার
    renderRoutineTable();
</script>

</body>
</html>
