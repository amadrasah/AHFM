<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS & Notification - AHIFM ERP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 font-sans">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-emerald-900 text-white flex flex-col shadow-lg hidden md:flex">
            <div class="p-4 bg-emerald-950 text-center border-b border-emerald-800">
                <h1 class="font-bold text-lg">AHIFM ERP</h1>
                <p class="text-xs text-emerald-300">ম্যানেজমেন্ট সিস্টেম</p>
            </div>

            <nav class="flex-1 overflow-y-auto p-4 space-y-2 text-sm">
                <a href="index.html" class="flex items-center gap-3 p-2.5 rounded hover:bg-emerald-800 transition">
                    <i class="fa-solid fa-house"></i> 01. Home
                </a>
                <a href="students.html" class="flex items-center gap-3 p-2.5 rounded hover:bg-emerald-800 transition">
                    <i class="fa-solid fa-user-graduate"></i> 03. Student Management
                </a>
                <a href="sms.html" class="flex items-center gap-3 p-2.5 rounded bg-emerald-800 text-white font-medium">
                    <i class="fa-solid fa-comment-sms"></i> 14. SMS Notification
                </a>
                <a href="library.html" class="flex items-center gap-3 p-2.5 rounded hover:bg-emerald-800 transition">
                    <i class="fa-solid fa-book"></i> 15. Library Management
                </a>
                <a href="settings.html" class="flex items-center gap-3 p-2.5 rounded hover:bg-emerald-800 transition">
                    <i class="fa-solid fa-gear"></i> 22. Settings
                </a>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-y-auto">
            
            <!-- Top Navbar -->
            <header class="bg-white shadow-sm p-4 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="font-bold text-emerald-800 text-xl">এসএমএস ও নোটিফিকেশন প্যানেল</span>
                </div>
                <div class="flex items-center gap-4">
                    <span class="text-sm text-gray-600">অ্যাডমিন প্যানেল</span>
                    <a href="index.html" class="bg-red-600 text-white px-4 py-1.5 rounded text-sm font-medium hover:bg-red-700">লগআউট</a>
                </div>
            </header>

            <!-- Page Content -->
            <main class="p-6 space-y-6">
                
                <!-- SMS Statistics Cards -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-emerald-600">
                        <p class="text-gray-500 text-sm">এসএমএস ব্যালেন্স</p>
                        <h3 class="text-2xl font-bold text-emerald-700">৫,৪৫০ টি</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-blue-600">
                        <p class="text-gray-500 text-sm">চলতি মাসে প্রেরিত এসএমএস</p>
                        <h3 class="text-2xl font-bold text-blue-700">১,২৫০ টি</h3>
                    </div>
                    <div class="bg-white p-5 rounded-xl shadow-sm border-l-4 border-amber-600">
                        <p class="text-gray-500 text-sm">আজকে প্রেরিত এসএমএস</p>
                        <h3 class="text-2xl font-bold text-amber-700">৪৫ টি</h3>
                    </div>
                </div>

                <!-- Send SMS Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm max-w-2xl">
                    <h3 class="font-bold text-gray-800 mb-4 border-b pb-2 flex items-center gap-2">
                        <i class="fa-solid fa-paper-plane text-emerald-700"></i> নতুন এসএমএস পাঠান
                    </h3>
                    <form class="space-y-4 text-sm">
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">প্রাপক নির্বাচন করুন</label>
                            <select class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
                                <option>সকল শিক্ষার্থীর অভিভাবক</option>
                                <option>নির্দিষ্ট শ্রেণি (যেমন: আলিম প্রথম বর্ষ)</option>
                                <option>বকেয়া ফি ওয়ালা অভিভাবকগণ</option>
                                <option>সকল শিক্ষক ও স্টাফ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">এসএমএস-এর ধরন</label>
                            <select class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600">
                                <option>সাধারণ নোটিশ / ঘোষণা</option>
                                <option>অনুপস্থিতি সতর্কতা (Absent Alert)</option>
                                <option>ফি পরিশোধের তাগিদ</option>
                            </select>
                        </div>
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">মেসেজ লিখুন (বাংলা বা ইংরেজি)</label>
                            <textarea rows="4" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-600" placeholder="আপনার মেসেজ এখানে টাইপ করুন..."></textarea>
                        </div>
                        <div class="flex justify-end">
                            <button type="submit" class="bg-emerald-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-emerald-700 flex items-center gap-2">
                                <i class="fa-solid fa-share"></i> এসএমএস সেন্ড করুন
                            </button>
                        </div>
                    </form>
                </div>

            </main>

        </div>
    </div>

</body>
</html>
