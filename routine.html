<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ক্লাস রুটিন ও ম্যানেজমেন্ট সিস্টেম</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h2, h3 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Top Navigation Panels / Buttons */
        .top-panels {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .panel-btn {
            background-color: #8e44ad;
            color: white;
            padding: 10px 18px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .panel-btn:hover {
            background-color: #732d91;
        }

        /* Form Styling */
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
        }
        .input-box label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-box input, .input-box select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            grid-column: 1 / -1;
            justify-self: start;
        }
        .btn-submit:hover {
            background-color: #27ae60;
        }

        /* Day Tabs Styling */
        .day-tabs {
            display: flex;
            gap: 10px;
            margin-top: 30px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .tab-btn {
            padding: 10px 20px;
            background-color: #bdc3c7;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            color: #2c3e50;
            transition: 0.3s;
        }
        .tab-btn.active {
            background-color: #3498db;
            color: white;
        }
        .tab-btn:hover {
            background-color: #2980b9;
            color: white;
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        td:first-child {
            font-weight: bold;
            background-color: #ecf0f1;
            color: #2c3e50;
        }
        .subject-text {
            font-weight: bold;
            color: #2c3e50;
            display: block;
        }
        .teacher-text {
            font-size: 11px;
            color: #7f8c8d;
            font-style: italic;
            display: block;
            margin-top: 2px;
        }
        
        /* Modal / Section view styling for extra panels */
        .extra-panel-section {
            background: #f9f9f9;
            border: 1px dashed #3498db;
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- অতিরিক্ত প্যানেল বা বাটন (শিক্ষক পার্সোনাল রুটিন ও একাডেমিক ক্যালেন্ডার) -->
    <div class="top-panels">
        <button class="panel-btn" onclick="openPanel('teacherRoutine')">👨‍🏫 শিক্ষক পার্সোনাল রুটিন প্যানেল</button>
        <button class="panel-btn" onclick="openPanel('academicCalendar')">📅 একাডেমিক ক্যালেন্ডার প্যানেল</button>
    </div>

    <!-- অতিরিক্ত প্যানেলের ডিসপ্লে এরিয়া -->
    <div id="extraPanelDisplay" class="extra-panel-section">
        <h3 id="panelHeading" style="margin-top:0;">প্যানেল শিরোনাম</h3>
        <p id="panelContent">এখানে সংশ্লিষ্ট প্যানেলের তথ্য প্রদর্শিত হবে।</p>
        <button onclick="closePanel()" style="padding: 5px 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">বন্ধ করুন</button>
    </div>

    <!-- ১. ক্লাস রুটিন এন্ট্রি ফরম -->
    <h2>ক্লাস রুটিন এন্ট্রি ফরম</h2>
    <form id="routineForm">
        <div class="form-group">
            <div class="input-box">
                <label>বছর/সাল</label>
                <input type="number" id="year" value="2026" required>
            </div>
            <div class="input-box">
                <label>শ্রেণি</label>
                <select id="className" required>
                    <option value="">শ্রেণি নির্বাচন করুন</option>
                    <option value="ষষ্ঠ শ্রেণি">ষষ্ঠ শ্রেণি</option>
                    <option value="সপ্তম শ্রেণি">সপ্তম শ্রেণি</option>
                    <option value="অষ্টম শ্রেণি">অষ্টম শ্রেণি</option>
                    <option value="নবম শ্রেণি">নবম শ্রেণি</option>
                    <option value="দশম শ্রেণি">দশম শ্রেণি</option>
                </select>
            </div>
            <div class="input-box">
                <label>বার (Day)</label>
                <select id="day" required>
                    <option value="শনিবার">শনিবার</option>
                    <option value="রবিবার">রবিবার</option>
                    <option value="সোমবার">সোমবার</option>
                    <option value="মঙ্গলবার">মঙ্গলবার</option>
                    <option value="বুধবার">বুধবার</option>
                    <option value="বৃহস্পতিবার">বৃহস্পতিবার</option>
                </select>
            </div>
            <div class="input-box">
                <label>পিরিয়ড/ঘণ্টা</label>
                <select id="period" required>
                    <option value="1">১ম ঘণ্টা</option>
                    <option value="2">২য় ঘণ্টা</option>
                    <option value="3">৩য় ঘণ্টা</option>
                    <option value="4">৪র্থ ঘণ্টা</option>
                    <option value="5">৫ম ঘণ্টা</option>
                    <option value="6">৬ষ্ঠ ঘণ্টা</option>
                    <option value="7">৭ম ঘণ্টা</option>
                    <option value="8">৮ম ঘণ্টা</option>
                </select>
            </div>
            <!-- সেটিং ম্যানেজমেন্ট মডিউলের বিষয় ও কোড প্যানেল থেকে লিংকযোগ্য ড্রপডাউন -->
            <div class="input-box">
                <label>বিষয় (সেটিং মডিউল)</label>
                <select id="subject" required>
                    <option value="">বিষয় নির্বাচন করুন</option>
                    <option value="বাংলা [BNG]">বাংলা [BNG]</option>
                    <option value="ইংরেজি [ENG]">ইংরেজি [ENG]</option>
                    <option value="গণিত [MTH]">গণিত [MTH]</option>
                    <option value="বিজ্ঞান [SCI]">বিজ্ঞান [SCI]</option>
                    <option value="আইসিটি [ICT]">আইসিটি [ICT]</option>
                    <option value="ধর্ম [REL]">ধর্ম [REL]</option>
                </select>
            </div>
            <!-- টিচার অ্যান্ড স্টাফ ম্যানেজমেন্ট মডিউলের টিচার প্রোফাইল প্যানেল থেকে লিংকযোগ্য ড্রপডাউন -->
            <div class="input-box">
                <label>শিক্ষক (টিচার প্রোফাইল)</label>
                <select id="teacher" required>
                    <option value="">শিক্ষক নির্বাচন করুন</option>
                    <option value="M.R. (মোঃ রফিক)">মোঃ রফিক [M.R.]</option>
                    <option value="A.K. (আব্দুল করিম)">আব্দুল করিম [A.K.]</option>
                    <option value="S.N. (নাজমা সুলতানা)">নাজমা সুলতানা [S.N.]</option>
                    <option value="F.H. (ফয়সাল আহমেদ)">ফয়সাল আহমেদ [F.H.]</option>
                </select>
            </div>
        </div>
        <button type="submit" class="btn-submit">রুটিনে এন্ট্রি করুন</button>
    </form>

    <!-- ২. বারের আলাদা ট্যাব সিলেক্টর -->
    <div class="day-tabs" id="dayTabs">
        <button class="tab-btn active" onclick="switchDay('শনিবার')">শনিবার</button>
        <button class="tab-btn" onclick="switchDay('রবিবার')">রবিবার</button>
        <button class="tab-btn" onclick="switchDay('সোমবার')">সোমবার</button>
        <button class="tab-btn" onclick="switchDay('মঙ্গলবার')">মঙ্গলবার</button>
        <button class="tab-btn" onclick="switchDay('বুধবার')">বুধবার</button>
        <button class="tab-btn" onclick="switchDay('বৃহস্পতিবার')">বৃহস্পতিবার</button>
    </div>

    <!-- ৩. দৈনিক রুটিন টেবিল -->
    <h3 id="tableTitle">শনিবারের ক্লাস রুটিন</h3>
    <div class="table-responsive">
        <table id="routineTable">
            <thead>
                <tr>
                    <th>শ্রেণি</th>
                    <th>১ম ঘণ্টা</th>
                    <th>২য় ঘণ্টা</th>
                    <th>৩য় ঘণ্টা</th>
                    <th>৪র্থ ঘণ্টা</th>
                    <th>৫ম ঘণ্টা</th>
                    <th>৬ষ্ঠ ঘণ্টা</th>
                    <th>৭ম ঘণ্টা</th>
                    <th>৮ম ঘণ্টা</th>
                </tr>
            </thead>
            <tbody id="routineBody">
                <!-- ডাইনামিকালি ডাটা লোড হবে -->
            </tbody>
        </table>
    </div>
</div>

<script>
    let routineData = [];
    let currentSelectedDay = "শনিবার";
    
    const classesList = ["ষষ্ঠ শ্রেণি", "সপ্তম শ্রেণি", "অষ্টম শ্রেণি", "নবম শ্রেণি", "দশম শ্রেণি"];

    // ফরম সাবমিট হ্যান্ডলার
    document.getElementById('routineForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const entry = {
            year: document.getElementById('year').value,
            className: document.getElementById('className').value,
            day: document.getElementById('day').value,
            period: parseInt(document.getElementById('period').value),
            subject: document.getElementById('subject').value,
            teacher: document.getElementById('teacher').value
        };

        const existingIndex = routineData.findIndex(item => 
            item.year === entry.year && 
            item.className === entry.className && 
            item.day === entry.day && 
            item.period === entry.period
        );

        if (existingIndex > -1) {
            routineData[existingIndex] = entry;
        } else {
            routineData.push(entry);
        }

        // রিসেট সিলেক্ট অপশন
        document.getElementById('subject').value = '';
        document.getElementById('teacher').value = '';

        renderRoutineTable();
    });

    // ট্যাব পরিবর্তন ফাংশন
    function switchDay(day) {
        currentSelectedDay = day;
        let buttons = document.querySelectorAll('.day-tabs .tab-btn');
        buttons.forEach(btn => {
            if(btn.innerText === day) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });

        document.getElementById('tableTitle').innerText = `${day}র ক্লাস রুটিন`;
        renderRoutineTable();
    }

    // টেবিল রেন্ডার করার ফাংশন
    function renderRoutineTable() {
        const tbody = document.getElementById('routineBody');
        tbody.innerHTML = '';

        classesList.forEach(cls => {
            let rowHtml = `<tr><td>${cls}</td>`;

            for (let p = 1; p <= 8; p++) {
                const matchedEntry = routineData.find(item => 
                    item.day === currentSelectedDay && 
                    item.className === cls && 
                    item.period === p
                );

                if (matchedEntry) {
                    rowHtml += `<td>
                        <span class="subject-text">${matchedEntry.subject}</span>
                        <span class="teacher-text">(${matchedEntry.teacher})</span>
                    </td>`;
                } else {
                    rowHtml += `<td>-</td>`;
                }
            }

            rowHtml += `</tr>`;
            tbody.innerHTML += rowHtml;
        });
    }

    // অতিরিক্ত প্যানেল কন্ট্রোল ফাংশন
    function openPanel(panelType) {
        const displayDiv = document.getElementById('extraPanelDisplay');
        const heading = document.getElementById('panelHeading');
        const content = document.getElementById('panelContent');
        
        displayDiv.style.display = 'block';

        if(panelType === 'teacherRoutine') {
            heading.innerText = "শিক্ষক পার্সোনাল রুটিন প্যানেল";
            content.innerText = "এখানে নির্দিষ্ট শিক্ষকের ব্যক্তিগত ক্লাস শিডিউল ও রুটিন দেখা যাবে (টিচার প্রোফাইল মডিউল সংযুক্ত)।";
        } else if(panelType === 'academicCalendar') {
            heading.innerText = "একাডেমিক ক্যালেন্ডার প্যানেল";
            content.innerText = "এখানে প্রতিষ্ঠানের বার্ষিক পরীক্ষা, ছুটি এবং বিশেষ কার্যক্রমের দিনলিপি বা ক্যালেন্ডার প্রদর্শিত হবে।";
        }
    }

    function closePanel() {
        document.getElementById('extraPanelDisplay').style.display = 'none';
    }

    renderRoutineTable();
</script>

</body>
</html>
