<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ক্লাস রুটিন ম্যানেজমেন্ট</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        h2, h3 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 5px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        /* Form Styling */
        .form-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        .input-box {
            display: flex;
            flex-direction: column;
        }
        .input-box label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        .input-box input, .input-box select {
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .btn-submit {
            background-color: #2ecc71;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            grid-column: 1 / -1;
            justify-self: start;
        }
        .btn-submit:hover {
            background-color: #27ae60;
        }

        /* Filter Section */
        .filter-section {
            background: #eef2f5;
            padding: 15px;
            border-radius: 6px;
            margin-top: 30px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn-filter {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 9px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 18px;
        }
        .btn-filter:hover {
            background-color: #2980b9;
        }

        /* Table Styling */
        .table-responsive {
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: white;
        }
        th, td {
            border: 1px solid #bdc3c7;
            padding: 10px;
            text-align: center;
            font-size: 13px;
        }
        th {
            background-color: #34495e;
            color: white;
        }
        .subject-text {
            font-weight: bold;
            color: #2c3e50;
            display: block;
        }
        .teacher-text {
            font-size: 11px;
            color: #7f8c8d;
            font-style: italic;
            display: block;
            margin-top: 2px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ১. ক্লাস রুটিন ইনপুট ফরম -->
    <h2>ক্লাস রুটিন এন্ট্রি ফরম</h2>
    <form id="routineForm">
        <div class="form-group">
            <div class="input-box">
                <label>বছর/সাল</label>
                <input type="number" id="year" value="2026" required>
            </div>
            <div class="input-box">
                <label>শ্রেণি</label>
                <select id="className" required>
                    <option value="">শ্রেণি নির্বাচন করুন</option>
                    <option value="Class 6">ষষ্ঠ শ্রেণি</option>
                    <option value="Class 7">সপ্তম শ্রেণি</option>
                    <option value="Class 8">অষ্টম শ্রেণি</option>
                    <option value="Class 9">নবম শ্রেণি</option>
                    <option value="Class 10">দশম শ্রেণি</option>
                </select>
            </div>
            <div class="input-box">
                <label>বার (Day)</label>
                <select id="day" required>
                    <option value="শনিবার">শনিবার</option>
                    <option value="রবিবার">রবিবার</option>
                    <option value="সোমবার">সোমবার</option>
                    <option value="মঙ্গলবার">মঙ্গলবার</option>
                    <option value="বুধবার">বুধবার</option>
                    <option value="বৃহস্পতিবার">বৃহস্পতিবার</option>
                </select>
            </div>
            <div class="input-box">
                <label>পিরিয়ড/ঘণ্টা</label>
                <select id="period" required>
                    <option value="1">১ম ঘণ্টা (09:00 - 09:45)</option>
                    <option value="2">২য় ঘণ্টা (09:45 - 10:30)</option>
                    <option value="3">৩য় ঘণ্টা (10:30 - 11:15)</option>
                    <option value="4">৪র্থ ঘণ্টা (11:15 - 12:00)</option>
                    <option value="5">৫ম ঘণ্টা (12:00 - 12:45)</option>
                    <option value="6">৬ষ্ঠ ঘণ্টা (01:30 - 02:15)</option>
                    <option value="7">৭ম ঘণ্টা (02:15 - 03:00)</option>
                    <option value="8">৮ম ঘণ্টা (03:00 - 03:45)</option>
                </select>
            </div>
            <div class="input-box">
                <label>বিষয়</label>
                <input type="text" id="subject" placeholder="যেমন: গণিত" required>
            </div>
            <div class="input-box">
                <label>শিক্ষকের নাম (সংক্ষেপে)</label>
                <input type="text" id="teacher" placeholder="যেমন: M.R. (মোঃ রফিক)" required>
            </div>
        </div>
        <button type="submit" class="btn-submit">রুটিনে এন্ট্রি করুন</button>
    </form>

    <!-- ২. ফিল্টারিং সেকশন -->
    <div class="filter-section">
        <div class="input-box">
            <label>ফিল্টার সাল:</label>
            <input type="number" id="filterYear" value="2026">
        </div>
        <div class="input-box">
            <label>ফিল্টার শ্রেণি:</label>
            <select id="filterClass">
                <option value="ALL">সকল শ্রেণি</option>
                <option value="Class 6">ষষ্ঠ শ্রেণি</option>
                <option value="Class 7">সপ্তম শ্রেণি</option>
                <option value="Class 8">অষ্টম শ্রেণি</option>
                <option value="Class 9">নবম শ্রেণি</option>
                <option value="Class 10">দশম শ্রেণি</option>
            </select>
        </div>
        <div class="input-box">
            <label>ফিল্টার শিক্ষক:</label>
            <input type="text" id="filterTeacher" placeholder="শিক্ষকের নাম সংক্ষেপে">
        </div>
        <button type="button" class="btn-filter" onclick="renderRoutineTable()">ফিল্টার করুন</button>
    </div>

    <!-- ৩. সমন্বিত রুটিন ফরম/টেবিল -->
    <h3>সমন্বিত ক্লাস রুটিন (Combined Routine)</h3>
    <div class="table-responsive">
        <table id="routineTable">
            <thead>
                <tr>
                    <th>বার / সময়</th>
                    <th>১ম ঘণ্টা<br><small>09:00-09:45</small></th>
                    <th>২য় ঘণ্টা<br><small>09:45-10:30</small></th>
                    <th>৩য় ঘণ্টা<br><small>10:30-11:15</small></th>
                    <th>৪র্থ ঘণ্টা<br><small>11:15-12:00</small></th>
                    <th>৫ম ঘণ্টা<br><small>12:00-12:45</small></th>
                    <th>৬ষ্ঠ ঘণ্টা<br><small>01:30-02:15</small></th>
                    <th>৭ম ঘণ্টা<br><small>02:15-03:00</small></th>
                    <th>৮ম ঘণ্টা<br><small>03:00-03:45</small></th>
                </tr>
            </thead>
            <tbody id="routineBody">
                <!-- জাভাস্ক্রিপ্টের মাধ্যমে এখানে ডাটা রেন্ডার হবে -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // রুটিনের ডাটা সংরক্ষণের জন্য অ্যারে
    let routineData = [];

    const days = ["শনিবার", "রবিবার", "সোমবার", "মঙ্গলবার", "বুধবার", "বৃহস্পতিবার"];

    // ফরম সাবমিট হ্যান্ডলার
    document.getElementById('routineForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const entry = {
            year: document.getElementById('year').value,
            className: document.getElementById('className').value,
            day: document.getElementById('day').value,
            period: parseInt(document.getElementById('period').value),
            subject: document.getElementById('subject').value,
            teacher: document.getElementById('teacher').value
        };

        // পূর্বে একই দিনে ও সময়ে কোনো ডাটা থাকলে তা আপডেট হবে, নাহলে নতুন যোগ হবে
        const existingIndex = routineData.findIndex(item => 
            item.year === entry.year && 
            item.className === entry.className && 
            item.day === entry.day && 
            item.period === entry.period
        );

        if (existingIndex > -1) {
            routineData[existingIndex] = entry;
        } else {
            routineData.push(entry);
        }

        // ইনপুট রিসেট
        document.getElementById('subject').value = '';
        document.getElementById('teacher').value = '';

        // টেবিল রিফ্রেশ
        renderRoutineTable();
    });

    // সমন্বিত রুটিন টেবিলে ডাটা দেখানোর ফাংশন
    function renderRoutineTable() {
        const filterYear = document.getElementById('filterYear').value;
        const filterClass = document.getElementById('filterClass').value;
        const filterTeacher = document.getElementById('filterTeacher').value.trim().toLowerCase();

        const tbody = document.getElementById('routineBody');
        tbody.innerHTML = '';

        days.forEach(day => {
            let rowHtml = `<tr><strong><td>${day}</td></strong>`;

            for (let p = 1; p <= 8; p++) {
                // ফিল্টার অনুযায়ী ডাটা খোঁজা
                const matchedEntries = routineData.filter(item => {
                    const matchYear = !filterYear || item.year === filterYear;
                    const matchClass = filterClass === 'ALL' || item.className === filterClass;
                    const matchTeacher = !filterTeacher || item.teacher.toLowerCase().includes(filterTeacher);
                    return item.day === day && item.period === p && matchYear && matchClass && matchTeacher;
                });

                if (matchedEntries.length > 0) {
                    let cellContent = matchedEntries.map(e => 
                        `<span class="subject-text">${e.subject}</span><span class="teacher-text">(${e.teacher})</span>`
                    ).join('<hr style="margin: 4px 0; border: 0.5px solid #eee;">');

                    rowHtml += `<td>${cellContent}</td>`;
                } else {
                    rowHtml += `<td>-</td>`;
                }
            }

            rowHtml += `</tr>`;
            tbody.innerHTML += rowHtml;
        });
    }

    // প্রথমবার পেজ লোড হলে খালি টেবিল তৈরি করবে
    renderRoutineTable();
</script>

</body>
</html>
